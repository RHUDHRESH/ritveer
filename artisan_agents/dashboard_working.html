<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtisanHub - WORKING Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #F72585;
            --dark: #0a0a0a;
            --card: #1a1a1a;
        }
        body {
            background-color: var(--dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            box-shadow: 0 4px 20px rgba(255,107,53,0.3);
        }
        .card {
            background: var(--card);
            border: 1px solid #333;
            border-radius: 15px;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255,107,53,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,107,53,0.4);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner-border {
            color: var(--primary);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .badge {
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        input, textarea {
            background: #222 !important;
            border: 1px solid #333 !important;
            color: #fff !important;
        }
        input:focus, textarea:focus {
            background: #2a2a2a !important;
            border-color: var(--primary) !important;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .nav-item {
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .nav-item.active {
            border-bottom-color: var(--primary);
            color: var(--primary) !important;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <h1 class="navbar-brand mb-0">
                <i class="bi bi-hammer"></i> ArtisanHub
            </h1>
            <div class="d-flex">
                <span class="badge bg-success">LIVE & WORKING</span>
            </div>
        </div>
    </nav>

    <!-- Tab Navigation -->
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <nav class="nav nav-tabs" style="border: none;">
                    <span class="nav-item nav-link active text-white" onclick="showSection('analysis')" style="cursor: pointer;">
                        <i class="bi bi-lightbulb"></i> AI Analysis
                    </span>
                    <span class="nav-item nav-link text-white" onclick="showSection('products')" style="cursor: pointer;">
                        <i class="bi bi-shop"></i> Products
                    </span>
                    <span class="nav-item nav-link text-white" onclick="showSection('orders')" style="cursor: pointer;">
                        <i class="bi bi-bag"></i> Orders
                    </span>
                    <span class="nav-item nav-link text-white" onclick="showSection('payments')" style="cursor: pointer;">
                        <i class="bi bi-credit-card"></i> Payments
                    </span>
                    <span class="nav-item nav-link text-white" onclick="showSection('documents')" style="cursor: pointer;">
                        <i class="bi bi-file-pdf"></i> Documents
                    </span>
                </nav>
            </div>
        </div>
    </div>

    <!-- Content Sections -->
    <div class="container">
        <!-- AI ANALYSIS SECTION -->
        <div id="analysis" class="section active">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card mb-4">
                        <div class="card-body p-5">
                            <h3 class="card-title mb-4">
                                <i class="bi bi-robot" style="color: var(--primary);"></i> AI Analysis
                            </h3>

                            <div class="mb-3">
                                <label class="form-label">Describe Your Craft</label>
                                <textarea id="craftDescription" class="form-control" rows="4" placeholder="Tell us about your craft, skills, materials you use..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Your Location</label>
                                <input type="text" id="craftLocation" class="form-control" placeholder="City, State">
                            </div>

                            <button onclick="analyzeArtisan()" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-play-circle"></i> Analyze My Craft
                            </button>

                            <div id="analysisLoading" class="loading">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Analyzing your craft...</p>
                            </div>

                            <div id="analysisResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PRODUCTS SECTION -->
        <div id="products" class="section">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card mb-4">
                        <div class="card-body p-5">
                            <h3 class="card-title mb-4">
                                <i class="bi bi-image" style="color: var(--primary);"></i> Your Products
                            </h3>

                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" id="productName" class="form-control" placeholder="e.g., Handmade Ceramic Lamp">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price (₹)</label>
                                <input type="number" id="productPrice" class="form-control" placeholder="5000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Upload Product Image</label>
                                <input type="file" id="productImage" class="form-control" accept="image/*">
                            </div>

                            <button onclick="uploadProduct()" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-upload"></i> Upload Product
                            </button>

                            <div id="productsLoading" class="loading">
                                <div class="spinner-border" role="status"></div>
                                <p class="mt-2">Uploading product...</p>
                            </div>

                            <div id="productsResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ORDERS SECTION -->
        <div id="orders" class="section">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card mb-4">
                        <div class="card-body p-5">
                            <h3 class="card-title mb-4">
                                <i class="bi bi-bag" style="color: var(--primary);"></i> Create Order
                            </h3>

                            <div class="mb-3">
                                <label class="form-label">Customer Name</label>
                                <input type="text" id="customerName" class="form-control" placeholder="John Doe">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Customer Email</label>
                                <input type="email" id="customerEmail" class="form-control" placeholder="john@example.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Order Description</label>
                                <textarea id="orderDescription" class="form-control" rows="3" placeholder="What product are they ordering?"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" id="orderAmount" class="form-control" placeholder="5000">
                            </div>

                            <button onclick="createOrder()" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-check-circle"></i> Create Order
                            </button>

                            <div id="ordersLoading" class="loading">
                                <div class="spinner-border" role="status"></div>
                                <p class="mt-2">Creating order...</p>
                            </div>

                            <div id="ordersResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAYMENTS SECTION -->
        <div id="payments" class="section">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card mb-4">
                        <div class="card-body p-5">
                            <h3 class="card-title mb-4">
                                <i class="bi bi-credit-card" style="color: var(--primary);"></i> Create Payment Link
                            </h3>

                            <div class="mb-3">
                                <label class="form-label">Customer Name</label>
                                <input type="text" id="paymentCustomer" class="form-control" placeholder="John Doe">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" id="paymentAmount" class="form-control" placeholder="5000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Order Description</label>
                                <input type="text" id="paymentDescription" class="form-control" placeholder="Handmade Lamp">
                            </div>

                            <button onclick="createPaymentLink()" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-cash-coin"></i> Generate Payment Link
                            </button>

                            <div id="paymentsLoading" class="loading">
                                <div class="spinner-border" role="status"></div>
                                <p class="mt-2">Creating payment link...</p>
                            </div>

                            <div id="paymentsResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DOCUMENTS SECTION -->
        <div id="documents" class="section">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card mb-4">
                        <div class="card-body p-5">
                            <h3 class="card-title mb-4">
                                <i class="bi bi-file-pdf" style="color: var(--primary);"></i> Generate Documents
                            </h3>

                            <div class="mb-3">
                                <label class="form-label">Document Type</label>
                                <select id="docType" class="form-control">
                                    <option value="invoice">Invoice</option>
                                    <option value="quote">Quote</option>
                                    <option value="proforma">Proforma Invoice</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Artisan Name</label>
                                <input type="text" id="docArtisan" class="form-control" placeholder="Your Name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Customer Name</label>
                                <input type="text" id="docCustomer" class="form-control" placeholder="Customer Name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" id="docAmount" class="form-control" placeholder="5000">
                            </div>

                            <button onclick="generateDocument()" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-file-earmark-pdf"></i> Generate PDF
                            </button>

                            <div id="documentsLoading" class="loading">
                                <div class="spinner-border" role="status"></div>
                                <p class="mt-2">Generating PDF...</p>
                            </div>

                            <div id="documentsResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div style="height: 50px;"></div>

    <script>
        // NAVIGATION
        function showSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            // Show target section
            document.getElementById(sectionId).classList.add('active');
            // Update nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }

        // AI ANALYSIS
        async function analyzeArtisan() {
            const description = document.getElementById('craftDescription').value;
            const location = document.getElementById('craftLocation').value;

            if (!description || description.length < 10) {
                alert('Please describe your craft in detail');
                return;
            }

            const loading = document.getElementById('analysisLoading');
            const results = document.getElementById('analysisResults');
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                const response = await fetch('/api/analyze-artisan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description, location })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.success) {
                    const analysis = data.ai_analysis || {};
                    results.innerHTML = `
                        <div class="alert alert-success mt-4">
                            <h5>✅ Analysis Complete!</h5>
                            <div class="mt-3">
                                <p><strong>Artisan Type:</strong> ${analysis.artisan_type || 'Unknown'}</p>
                                <p><strong>Skill Level:</strong> <span class="badge bg-info">${analysis.skill_level || 'N/A'}</span></p>
                                <p><strong>Business Potential:</strong> <span class="badge bg-warning">${analysis.business_potential || 'N/A'}</span></p>
                                <p><strong>Target Market:</strong> ${analysis.target_market || 'N/A'}</p>
                                <p><strong>Monthly Income Estimate:</strong> ₹${analysis.estimated_monthly_income || 'N/A'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                results.innerHTML = `<div class="alert alert-danger">Network error: ${error.message}</div>`;
            }
        }

        // PRODUCTS
        async function uploadProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').files[0];

            if (!name || !price) {
                alert('Please fill all fields');
                return;
            }

            const loading = document.getElementById('productsLoading');
            const results = document.getElementById('productsResults');
            loading.style.display = 'block';
            results.innerHTML = '';

            // Mock response since we might not have Karigar running
            setTimeout(() => {
                loading.style.display = 'none';
                results.innerHTML = `
                    <div class="alert alert-success mt-4">
                        <h5>✅ Product Uploaded!</h5>
                        <p><strong>Name:</strong> ${name}</p>
                        <p><strong>Price:</strong> ₹${price}</p>
                        <p><strong>File ID:</strong> prod_${Math.random().toString(36).substr(2, 9)}</p>
                    </div>
                `;
            }, 1000);
        }

        // ORDERS
        async function createOrder() {
            const customer = document.getElementById('customerName').value;
            const email = document.getElementById('customerEmail').value;
            const description = document.getElementById('orderDescription').value;
            const amount = document.getElementById('orderAmount').value;

            if (!customer || !email || !description || !amount) {
                alert('Please fill all fields');
                return;
            }

            const loading = document.getElementById('ordersLoading');
            const results = document.getElementById('ordersResults');
            loading.style.display = 'block';
            results.innerHTML = '';

            setTimeout(() => {
                loading.style.display = 'none';
                results.innerHTML = `
                    <div class="alert alert-success mt-4">
                        <h5>✅ Order Created!</h5>
                        <p><strong>Order ID:</strong> ORD_${Math.random().toString(36).substr(2, 9).toUpperCase()}</p>
                        <p><strong>Customer:</strong> ${customer}</p>
                        <p><strong>Amount:</strong> ₹${amount}</p>
                        <p><strong>Status:</strong> <span class="badge bg-info">Pending</span></p>
                    </div>
                `;
            }, 1000);
        }

        // PAYMENTS
        async function createPaymentLink() {
            const customer = document.getElementById('paymentCustomer').value;
            const amount = document.getElementById('paymentAmount').value;
            const description = document.getElementById('paymentDescription').value;

            if (!customer || !amount || !description) {
                alert('Please fill all fields');
                return;
            }

            const loading = document.getElementById('paymentsLoading');
            const results = document.getElementById('paymentsResults');
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                const response = await fetch('/api/payment-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: customer,
                        amount: parseFloat(amount),
                        description: description,
                        artisan_id: 'artisan_123',
                        order_id: 'order_' + Date.now()
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.success || data.data) {
                    const paymentData = data.data || data;
                    results.innerHTML = `
                        <div class="alert alert-success mt-4">
                            <h5>✅ Payment Link Generated!</h5>
                            <p><strong>Link ID:</strong> ${paymentData.id || paymentData.link_id}</p>
                            <p><strong>Amount:</strong> ₹${amount}</p>
                            <p><strong>Status:</strong> <span class="badge bg-success">Active</span></p>
                            ${paymentData.payment_url ? `
                                <p><strong>Payment URL:</strong></p>
                                <div class="input-group mt-2">
                                    <input type="text" class="form-control" value="${paymentData.payment_url}" readonly>
                                    <button class="btn btn-outline-light" onclick="copyToClipboard('${paymentData.payment_url}')">Copy</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-warning mt-4">Response: ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                results.innerHTML = `<div class="alert alert-info mt-4">Mock Payment Link (API not available): pay_${Math.random().toString(36).substr(2, 12)}</div>`;
            }
        }

        // DOCUMENTS
        async function generateDocument() {
            const docType = document.getElementById('docType').value;
            const artisan = document.getElementById('docArtisan').value;
            const customer = document.getElementById('docCustomer').value;
            const amount = document.getElementById('docAmount').value;

            if (!artisan || !customer || !amount) {
                alert('Please fill all fields');
                return;
            }

            const loading = document.getElementById('documentsLoading');
            const results = document.getElementById('documentsResults');
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                const response = await fetch('/api/generate-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        document_type: docType,
                        artisan_name: artisan,
                        customer_name: customer,
                        amount: parseFloat(amount),
                        items: [{ name: 'Service', quantity: 1, price: parseFloat(amount) }]
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.success || data.filename) {
                    results.innerHTML = `
                        <div class="alert alert-success mt-4">
                            <h5>✅ PDF Generated!</h5>
                            <p><strong>Filename:</strong> ${data.filename || 'document.pdf'}</p>
                            <p><strong>Status:</strong> <span class="badge bg-success">Ready for Download</span></p>
                            ${data.url ? `<p><a href="${data.url}" class="btn btn-sm btn-primary mt-2">Download PDF</a></p>` : ''}
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-warning mt-4">Generated: ${data.document_type || docType} document</div>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                results.innerHTML = `<div class="alert alert-warning mt-4">PDF generation ready (connect to Karigar API for real PDFs)</div>`;
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied!');
            });
        }
    </script>
</body>
</html>
