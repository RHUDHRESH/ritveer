
version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://artisan_user:artisan_password@db/artisan_db

  db:
    image: postgis/postgis:13-master
    environment:
      - POSTGRES_USER=artisan_user
      - POSTGRES_PASSWORD=artisan_password
      - POSTGRES_DB=artisan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
